name: Deploy Frontend - Vercel

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-frontend-production
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ci_walletconnect_project_id
  NEXT_PUBLIC_ALLOWED_CHAIN_IDS: "1,42161,10,8453,137,56,43114"
  NEXT_PUBLIC_DISALLOW_MAINNET: "false"
  NEXT_PUBLIC_BACKEND_BASE_URL: "http://localhost:8080"
  NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
  ZEROX_API_KEY: ""
  ONEINCH_API_KEY: ""
  PARASWAP_API_KEY: ""
  ODOS_API_KEY: ""
  LIFI_API_KEY: ""
  SWAP_PROVIDERS: "0x,1inch,paraswap,odos,lifi"
  CORS_ALLOW_ORIGINS: "http://localhost:3000"
  RATE_LIMIT_WINDOW_MS: "60000"
  RATE_LIMIT_MAX: "30"
  QUOTE_CACHE_TTL_MS: "8000"
  QUOTE_CACHE_MAX_ENTRIES: "2000"

jobs:
  deploy:
    name: Validate and trigger frontend deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://wallet-integration-theta.vercel.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=moderate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Trigger Vercel production deployment
        shell: bash
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_DEPLOY_HOOK_URL:-}" ]; then
            echo "Missing required GitHub secret: VERCEL_DEPLOY_HOOK_URL" >&2
            exit 1
          fi
          curl --fail --silent --show-error --retry 3 --request POST "$VERCEL_DEPLOY_HOOK_URL" >/dev/null
          echo "Triggered Vercel production deployment."
