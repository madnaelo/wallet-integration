name: Deploy Backend - OCI

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: write
  security-events: write

concurrency:
  group: deploy-backend-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/wallet-backend
  SSH_OPTS: >-
    -o ServerAliveInterval=30
    -o ServerAliveCountMax=20
    -o TCPKeepAlive=yes
    -o ConnectTimeout=30
    -o StrictHostKeyChecking=yes

jobs:
  build:
    name: Test, scan, and publish image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Test backend
        run: mvn -B -ntp -f backend/pom.xml clean test

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build image locally
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Select immutable image
        id: image
        run: echo "image=${REGISTRY}/${IMAGE_NAME}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Scan backend image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.image }}
          scanners: vuln
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          timeout: 10m

      - name: Build backend image SARIF
        if: ${{ !github.event.repository.private || vars.CODEQL_ENABLED == 'true' }}
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.image }}
          scanners: vuln
          format: sarif
          output: trivy-backend-image.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"
          ignore-unfixed: true
          timeout: 10m
          limit-severities-for-sarif: true

      - name: Upload backend image SARIF
        if: ${{ !github.event.repository.private || vars.CODEQL_ENABLED == 'true' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-backend-image.sarif

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish scanned image
        shell: bash
        run: |
          set -euo pipefail
          docker push "${REGISTRY}/${IMAGE_NAME}:sha-${GITHUB_SHA}"
          docker push "${REGISTRY}/${IMAGE_NAME}:latest"

  deploy:
    name: Deploy on OCI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
    env:
      OCI_SSH_PORT: ${{ secrets.OCI_SSH_PORT || '22' }}
      OCI_DEPLOY_PATH: ${{ secrets.OCI_DEPLOY_PATH || '/home/opc/wallet' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        shell: bash
        env:
          OCI_SSH_HOST: ${{ secrets.OCI_SSH_HOST }}
          OCI_SSH_USER: ${{ secrets.OCI_SSH_USER }}
          OCI_SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          OCI_SSH_KNOWN_HOSTS: ${{ secrets.OCI_SSH_KNOWN_HOSTS }}
          OCI_BACKEND_ENV: ${{ secrets.OCI_BACKEND_ENV }}
          ONEINCH_API_KEY: ${{ secrets.ONEINCH_API_KEY }}
          COW_API_KEY: ${{ secrets.COW_API_KEY }}
          WALLET_API_DOMAIN: ${{ secrets.WALLET_API_DOMAIN }}
          OCI_PROXY_NETWORK: ${{ vars.OCI_PROXY_NETWORK || secrets.OCI_PROXY_NETWORK || secrets.OCI_CONTAINER_NETWORK }}
          OCI_CADDYFILE_PATH: ${{ vars.OCI_CADDYFILE_PATH || secrets.OCI_CADDYFILE_PATH }}
          OCI_CADDY_CONTAINER: ${{ vars.OCI_CADDY_CONTAINER || secrets.OCI_CADDY_CONTAINER }}
        run: |
          set -euo pipefail
          missing=()
          for name in OCI_SSH_HOST OCI_SSH_USER OCI_SSH_PRIVATE_KEY OCI_SSH_KNOWN_HOSTS OCI_BACKEND_ENV ONEINCH_API_KEY WALLET_API_DOMAIN OCI_PROXY_NETWORK OCI_CADDYFILE_PATH OCI_CADDY_CONTAINER; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required GitHub secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$OCI_SSH_PRIVATE_KEY" > ~/.ssh/oci_deploy_key
          chmod 600 ~/.ssh/oci_deploy_key
          printf '%s\n' "$OCI_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
        env:
          OCI_SSH_HOST: ${{ secrets.OCI_SSH_HOST }}
          OCI_SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          OCI_SSH_KNOWN_HOSTS: ${{ secrets.OCI_SSH_KNOWN_HOSTS }}

      - name: Upload deployment files
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          backend_env_file="$(mktemp)"
          trap 'rm -f "$backend_env_file"' EXIT
          ssh $SSH_OPTS -i ~/.ssh/oci_deploy_key -p "$OCI_SSH_PORT" "$OCI_SSH_USER@$OCI_SSH_HOST" \
            "mkdir -p '$OCI_DEPLOY_PATH/scripts/deploy' '$OCI_DEPLOY_PATH/infra/systemd'"
          scp $SSH_OPTS -i ~/.ssh/oci_deploy_key -P "$OCI_SSH_PORT" \
            scripts/deploy/deploy-oci-backend.sh \
            scripts/deploy/backup-oci-postgres.sh \
            "$OCI_SSH_USER@$OCI_SSH_HOST:$OCI_DEPLOY_PATH/scripts/deploy/"
          scp $SSH_OPTS -i ~/.ssh/oci_deploy_key -P "$OCI_SSH_PORT" \
            infra/systemd/wallet-postgres-backup.service \
            infra/systemd/wallet-postgres-backup.timer \
            "$OCI_SSH_USER@$OCI_SSH_HOST:$OCI_DEPLOY_PATH/infra/systemd/"
          {
            printf '%s\n' "$OCI_BACKEND_ENV"
            printf '\nLIMIT_ORDERS_DEFAULT_ENABLED=true\n'
            printf 'ONEINCH_API_KEY=%s\n' "$ONEINCH_API_KEY"
            printf 'ONEINCH_ORDERBOOK_BASE_URL=https://api.1inch.com/orderbook/v4.1\n'
            printf 'COW_API_KEY=%s\n' "${COW_API_KEY:-}"
            printf 'COW_ORDERBOOK_BASE_URL=https://api.cow.fi\n'
            printf 'COW_PARTNER_ORDERBOOK_BASE_URL=https://partners.cow.fi\n'
            printf 'LIMIT_ORDER_ORDERBOOK_SUBMISSION_ENABLED=true\n'
            printf 'LIMIT_ORDER_REQUEST_TIMEOUT_SECONDS=8\n'
            printf 'LIMIT_ORDER_SUBMISSION_RETRY_FIXED_DELAY_MS=30000\n'
            printf 'LIMIT_ORDER_SUBMISSION_BATCH_SIZE=25\n'
            printf 'LIMIT_ORDER_SUBMISSION_MAX_ATTEMPTS=8\n'
            printf 'LIMIT_ORDER_SUBMISSION_LOCK_TTL_SECONDS=60\n'
            printf 'LIMIT_ORDER_STATUS_CHECK_FIXED_DELAY_MS=30000\n'
            printf 'LIMIT_ORDER_STATUS_CHECK_BATCH_SIZE=50\n'
            printf 'LIMIT_ORDER_STATUS_CHECK_LOCK_TTL_SECONDS=60\n'
            printf 'LIMIT_ORDER_STATUS_CHECK_OPEN_INTERVAL_SECONDS=60\n'
            printf 'LIMIT_ORDER_STATUS_CHECK_PARTIAL_INTERVAL_SECONDS=30\n'
            printf 'LIMIT_ORDER_STATUS_CHECK_MAX_BACKOFF_SECONDS=1800\n'
          } > "$backend_env_file"
          scp $SSH_OPTS -i ~/.ssh/oci_deploy_key -P "$OCI_SSH_PORT" \
            "$backend_env_file" "$OCI_SSH_USER@$OCI_SSH_HOST:$OCI_DEPLOY_PATH/backend.env.next"
          ssh $SSH_OPTS -i ~/.ssh/oci_deploy_key -p "$OCI_SSH_PORT" "$OCI_SSH_USER@$OCI_SSH_HOST" \
            "chmod 600 '$OCI_DEPLOY_PATH/backend.env.next' && mv '$OCI_DEPLOY_PATH/backend.env.next' '$OCI_DEPLOY_PATH/backend.env' && chmod +x '$OCI_DEPLOY_PATH/scripts/deploy/deploy-oci-backend.sh' '$OCI_DEPLOY_PATH/scripts/deploy/backup-oci-postgres.sh'"
        env:
          OCI_SSH_HOST: ${{ secrets.OCI_SSH_HOST }}
          OCI_SSH_USER: ${{ secrets.OCI_SSH_USER }}
          OCI_BACKEND_ENV: ${{ secrets.OCI_BACKEND_ENV }}
          ONEINCH_API_KEY: ${{ secrets.ONEINCH_API_KEY }}
          COW_API_KEY: ${{ secrets.COW_API_KEY }}

      - name: Deploy backend
        shell: bash
        run: |
          set -euo pipefail
          deployed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ssh $SSH_OPTS -i ~/.ssh/oci_deploy_key -p "$OCI_SSH_PORT" "$OCI_SSH_USER@$OCI_SSH_HOST" \
            "cd '$OCI_DEPLOY_PATH' && BACKEND_IMAGE='$BACKEND_IMAGE' APP_VERSION='$APP_VERSION' GIT_COMMIT='$GIT_COMMIT' DEPLOYED_AT='$deployed_at' GHCR_USERNAME='$GHCR_USERNAME' GHCR_TOKEN='$GHCR_TOKEN' OCI_DEPLOY_PATH='$OCI_DEPLOY_PATH' WALLET_API_DOMAIN='$WALLET_API_DOMAIN' OCI_PROXY_NETWORK='$OCI_PROXY_NETWORK' OCI_INTERNAL_NETWORK='$OCI_INTERNAL_NETWORK' OCI_CONTAINER_ENGINE='$OCI_CONTAINER_ENGINE' OCI_CADDYFILE_PATH='$OCI_CADDYFILE_PATH' OCI_CADDY_CONTAINER='$OCI_CADDY_CONTAINER' ./scripts/deploy/deploy-oci-backend.sh"
        env:
          BACKEND_IMAGE: ${{ needs.build.outputs.image }}
          APP_VERSION: ${{ github.sha }}
          GIT_COMMIT: ${{ github.sha }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN || github.token }}
          OCI_SSH_HOST: ${{ secrets.OCI_SSH_HOST }}
          OCI_SSH_USER: ${{ secrets.OCI_SSH_USER }}
          WALLET_API_DOMAIN: ${{ secrets.WALLET_API_DOMAIN }}
          OCI_PROXY_NETWORK: ${{ vars.OCI_PROXY_NETWORK || secrets.OCI_PROXY_NETWORK || secrets.OCI_CONTAINER_NETWORK }}
          OCI_INTERNAL_NETWORK: ${{ vars.OCI_INTERNAL_NETWORK || secrets.OCI_INTERNAL_NETWORK || 'wallet-internal' }}
          OCI_CONTAINER_ENGINE: ${{ vars.OCI_CONTAINER_ENGINE || secrets.OCI_CONTAINER_ENGINE }}
          OCI_CADDYFILE_PATH: ${{ vars.OCI_CADDYFILE_PATH || secrets.OCI_CADDYFILE_PATH }}
          OCI_CADDY_CONTAINER: ${{ vars.OCI_CADDY_CONTAINER || secrets.OCI_CADDY_CONTAINER }}
