name: Deploy Backend - OCI

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: write
  security-events: write

concurrency:
  group: deploy-backend-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/wallet-backend

jobs:
  build:
    name: Build and publish image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Test backend
        run: mvn -B -ntp -f backend/pom.xml clean test

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Select immutable image
        id: image
        run: echo "image=${REGISTRY}/${IMAGE_NAME}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Scan backend image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.image }}
          scanners: vuln
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          timeout: 10m

      - name: Build backend image SARIF
        if: ${{ !github.event.repository.private || vars.CODEQL_ENABLED == 'true' }}
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.image }}
          scanners: vuln
          format: sarif
          output: trivy-backend-image.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"
          ignore-unfixed: true
          timeout: 10m
          limit-severities-for-sarif: true

      - name: Upload backend image SARIF
        if: ${{ !github.event.repository.private || vars.CODEQL_ENABLED == 'true' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-backend-image.sarif

  deploy:
    name: Deploy on OCI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
    env:
      OCI_SSH_PORT: ${{ secrets.OCI_SSH_PORT || '22' }}
      OCI_DEPLOY_PATH: ${{ secrets.OCI_DEPLOY_PATH || '/home/opc/wallet' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate deployment secrets
        shell: bash
        env:
          OCI_SSH_HOST: ${{ secrets.OCI_SSH_HOST }}
          OCI_SSH_USER: ${{ secrets.OCI_SSH_USER }}
          OCI_SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          OCI_SSH_KNOWN_HOSTS: ${{ secrets.OCI_SSH_KNOWN_HOSTS }}
          OCI_BACKEND_ENV: ${{ secrets.OCI_BACKEND_ENV }}
          WALLET_API_DOMAIN: ${{ secrets.WALLET_API_DOMAIN }}
        run: |
          set -euo pipefail
          missing=()
          for name in OCI_SSH_HOST OCI_SSH_USER OCI_SSH_PRIVATE_KEY OCI_SSH_KNOWN_HOSTS OCI_BACKEND_ENV WALLET_API_DOMAIN; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required GitHub secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$OCI_SSH_PRIVATE_KEY" > ~/.ssh/oci_deploy_key
          chmod 600 ~/.ssh/oci_deploy_key
          printf '%s\n' "$OCI_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
        env:
          OCI_SSH_HOST: ${{ secrets.OCI_SSH_HOST }}
          OCI_SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          OCI_SSH_KNOWN_HOSTS: ${{ secrets.OCI_SSH_KNOWN_HOSTS }}

      - name: Upload deployment files
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/oci_deploy_key -p "$OCI_SSH_PORT" "$OCI_SSH_USER@$OCI_SSH_HOST" \
            "mkdir -p '$OCI_DEPLOY_PATH/scripts/deploy' '$OCI_DEPLOY_PATH/infra/systemd'"
          scp -i ~/.ssh/oci_deploy_key -P "$OCI_SSH_PORT" \
            scripts/deploy/deploy-oci-backend.sh \
            scripts/deploy/backup-oci-postgres.sh \
            "$OCI_SSH_USER@$OCI_SSH_HOST:$OCI_DEPLOY_PATH/scripts/deploy/"
          scp -i ~/.ssh/oci_deploy_key -P "$OCI_SSH_PORT" \
            infra/systemd/wallet-postgres-backup.service \
            infra/systemd/wallet-postgres-backup.timer \
            "$OCI_SSH_USER@$OCI_SSH_HOST:$OCI_DEPLOY_PATH/infra/systemd/"
          printf '%s\n' "$OCI_BACKEND_ENV" | ssh -i ~/.ssh/oci_deploy_key -p "$OCI_SSH_PORT" "$OCI_SSH_USER@$OCI_SSH_HOST" \
            "cat > '$OCI_DEPLOY_PATH/backend.env' && chmod 600 '$OCI_DEPLOY_PATH/backend.env' && chmod +x '$OCI_DEPLOY_PATH/scripts/deploy/deploy-oci-backend.sh' '$OCI_DEPLOY_PATH/scripts/deploy/backup-oci-postgres.sh'"
        env:
          OCI_SSH_HOST: ${{ secrets.OCI_SSH_HOST }}
          OCI_SSH_USER: ${{ secrets.OCI_SSH_USER }}
          OCI_BACKEND_ENV: ${{ secrets.OCI_BACKEND_ENV }}

      - name: Deploy backend
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/oci_deploy_key -p "$OCI_SSH_PORT" "$OCI_SSH_USER@$OCI_SSH_HOST" \
            "cd '$OCI_DEPLOY_PATH' && BACKEND_IMAGE='$BACKEND_IMAGE' APP_VERSION='$APP_VERSION' GIT_COMMIT='$GIT_COMMIT' GHCR_USERNAME='$GHCR_USERNAME' GHCR_TOKEN='$GHCR_TOKEN' OCI_DEPLOY_PATH='$OCI_DEPLOY_PATH' WALLET_API_DOMAIN='$WALLET_API_DOMAIN' OCI_CONTAINER_NETWORK='$OCI_CONTAINER_NETWORK' OCI_CADDYFILE_PATH='$OCI_CADDYFILE_PATH' OCI_CADDY_CONTAINER='$OCI_CADDY_CONTAINER' ./scripts/deploy/deploy-oci-backend.sh"
        env:
          BACKEND_IMAGE: ${{ needs.build.outputs.image }}
          APP_VERSION: ${{ github.sha }}
          GIT_COMMIT: ${{ github.sha }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN || github.token }}
          OCI_SSH_HOST: ${{ secrets.OCI_SSH_HOST }}
          OCI_SSH_USER: ${{ secrets.OCI_SSH_USER }}
          WALLET_API_DOMAIN: ${{ secrets.WALLET_API_DOMAIN }}
          OCI_CONTAINER_NETWORK: ${{ secrets.OCI_CONTAINER_NETWORK || 'uk-property-check' }}
          OCI_CADDYFILE_PATH: ${{ secrets.OCI_CADDYFILE_PATH || '/home/opc/uk-property-check-middleware/Caddyfile' }}
          OCI_CADDY_CONTAINER: ${{ secrets.OCI_CADDY_CONTAINER || 'uk-property-check-caddy' }}
