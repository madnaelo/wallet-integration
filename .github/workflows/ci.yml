name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  repository-quality:
    name: Repository Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Lint GitHub Actions workflows
        run: >-
          docker run --rm
          -v "$PWD:/repo:ro"
          -w /repo
          rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9

      - name: Lint shell scripts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t scripts < <(git ls-files '*.sh')
          if (( ${#scripts[@]} == 0 )); then
            echo "No shell scripts found." >&2
            exit 1
          fi

          mounted_scripts=()
          for script in "${scripts[@]}"; do
            mounted_scripts+=("/repo/$script")
          done

          docker run --rm \
            -v "$PWD:/repo:ro" \
            koalaman/shellcheck-alpine@sha256:5921d946dac740cbeec2fb1c898747b6105e585130cc7f0602eec9a10f7ddb63 \
            shellcheck "${mounted_scripts[@]}"

      - name: Lint Dockerfiles
        run: >-
          docker run --rm
          -v "$PWD:/repo:ro"
          hadolint/hadolint@sha256:3c206a451cec6d486367e758645269fd7d696c5ccb6ff59d8b03b0e45268a199
          /bin/hadolint
          --failure-threshold warning
          /repo/Dockerfile.frontend
          /repo/backend/Dockerfile

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ci_walletconnect_project_id
      NEXT_PUBLIC_ALLOWED_CHAIN_IDS: "1,42161,10,8453,137,56,43114"
      NEXT_PUBLIC_DISALLOW_MAINNET: "false"
      NEXT_PUBLIC_BACKEND_BASE_URL: "http://localhost:8080"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
      NEXT_PUBLIC_APP_VERSION: ${{ github.sha }}
      ZEROX_API_KEY: ""
      ONEINCH_API_KEY: ""
      PARASWAP_API_KEY: ""
      ODOS_API_KEY: ""
      LIFI_API_KEY: ""
      SWAP_PROVIDERS: "0x,1inch,paraswap,odos,lifi"
      CORS_ALLOW_ORIGINS: "http://localhost:3000"
      REQUIRE_ALLOWED_ORIGIN: "false"
      RATE_LIMIT_WINDOW_MS: "60000"
      RATE_LIMIT_MAX: "30"
      UPSTASH_REDIS_REST_URL: ""
      UPSTASH_REDIS_REST_TOKEN: ""
      RATE_LIMIT_REDIS_PREFIX: "wallet-ci"
      RATE_LIMIT_REDIS_FAIL_OPEN: "false"
      QUOTE_CACHE_TTL_MS: "8000"
      QUOTE_CACHE_MAX_ENTRIES: "2000"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Test
        run: npm test

      - name: Audit frontend dependencies
        run: npm audit --audit-level=moderate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: wallet_ci
          POSTGRES_USER: wallet_ci
          POSTGRES_PASSWORD: wallet_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wallet_ci -d wallet_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/wallet_ci
      DATABASE_USERNAME: wallet_ci
      DATABASE_PASSWORD: wallet_ci_password
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      NOTIFICATIONS_MONITOR_ENABLED: "false"
      LIMIT_ORDER_ORDERBOOK_SUBMISSION_ENABLED: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Test and analyze
        run: mvn -B -ntp clean verify

      - name: Verify Flyway migrations and application startup
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp package -DskipTests
          java -jar target/swap-backend-0.1.0.jar > target/ci-startup.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" >/dev/null 2>&1 || true; wait "$app_pid" >/dev/null 2>&1 || true' EXIT

          deadline=$((SECONDS + 120))
          while (( SECONDS < deadline )); do
            if health=$(curl --fail --silent --show-error http://127.0.0.1:8080/api/health 2>/dev/null); then
              printf '%s' "$health" | grep -q '"status":"ok"'
              exit 0
            fi
            if ! kill -0 "$app_pid" >/dev/null 2>&1; then
              cat target/ci-startup.log >&2
              exit 1
            fi
            sleep 2
          done

          cat target/ci-startup.log >&2
          exit 1

  docker-config:
    name: Docker Compose Config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate local compose
        run: docker compose config

      - name: Validate full production compose
        run: docker compose --env-file infra/prod.env.example -f docker-compose.prod.yml config

      - name: Validate OCI backend compose
        run: docker compose --env-file infra/oci-backend.env.example -f docker-compose.oci-backend.yml config
