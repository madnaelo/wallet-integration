name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ci_walletconnect_project_id
      NEXT_PUBLIC_ALLOWED_CHAIN_IDS: "1,42161,10,8453,137,56,43114"
      NEXT_PUBLIC_DISALLOW_MAINNET: "false"
      NEXT_PUBLIC_BACKEND_BASE_URL: "http://localhost:8080"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
      ZEROX_API_KEY: ""
      ONEINCH_API_KEY: ""
      PARASWAP_API_KEY: ""
      ODOS_API_KEY: ""
      LIFI_API_KEY: ""
      SWAP_PROVIDERS: "0x,1inch,paraswap,odos,lifi"
      CORS_ALLOW_ORIGINS: "http://localhost:3000"
      RATE_LIMIT_WINDOW_MS: "60000"
      RATE_LIMIT_MAX: "30"
      UPSTASH_REDIS_REST_URL: ""
      UPSTASH_REDIS_REST_TOKEN: ""
      RATE_LIMIT_REDIS_PREFIX: "wallet-ci"
      RATE_LIMIT_REDIS_FAIL_OPEN: "false"
      QUOTE_CACHE_TTL_MS: "8000"
      QUOTE_CACHE_MAX_ENTRIES: "2000"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=moderate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Test
        run: mvn -B -ntp clean test

  docker-config:
    name: Docker Compose Config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate local compose
        run: docker compose config

      - name: Validate full production compose
        run: docker compose --env-file infra/prod.env.example -f docker-compose.prod.yml config

      - name: Validate OCI backend compose
        run: docker compose --env-file infra/oci-backend.env.example -f docker-compose.oci-backend.yml config
