services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wallet}
      POSTGRES_USER: ${POSTGRES_USER:-wallet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - wallet_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wallet} -d ${POSTGRES_DB:-wallet}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-production}
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-wallet}
      DATABASE_USERNAME: ${POSTGRES_USER:-wallet}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      CORS_ALLOWED_ORIGINS: https://${APP_DOMAIN:?APP_DOMAIN is required}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      NONCE_TTL_MINUTES: ${NONCE_TTL_MINUTES:-10}
      AUTH_SIGNING_DOMAIN: ${AUTH_SIGNING_DOMAIN:-${APP_DOMAIN}}
      AUTH_SIGNING_URI: ${AUTH_SIGNING_URI:-https://${APP_DOMAIN}}
      AUTH_SESSION_COOKIE_SAME_SITE: ${AUTH_SESSION_COOKIE_SAME_SITE:-Lax}
      AUTH_SESSION_COOKIE_PATH: ${AUTH_SESSION_COOKIE_PATH:-/backend}
      AUTH_SESSION_COOKIE_SECURE: ${AUTH_SESSION_COOKIE_SECURE:-true}
      AUTH_EXPOSE_ACCESS_TOKEN: ${AUTH_EXPOSE_ACCESS_TOKEN:-false}
      API_MAX_REQUEST_BODY_BYTES: ${API_MAX_REQUEST_BODY_BYTES:-1048576}
      API_RATE_LIMIT_ENABLED: ${API_RATE_LIMIT_ENABLED:-true}
      API_RATE_LIMIT_WINDOW_MS: ${API_RATE_LIMIT_WINDOW_MS:-60000}
      API_RATE_LIMIT_MAX_REQUESTS: ${API_RATE_LIMIT_MAX_REQUESTS:-120}
      API_AUTH_RATE_LIMIT_MAX_REQUESTS: ${API_AUTH_RATE_LIMIT_MAX_REQUESTS:-20}
      API_RATE_LIMIT_KEY_PEPPER: ${API_RATE_LIMIT_KEY_PEPPER:?API_RATE_LIMIT_KEY_PEPPER is required}
      API_TRUST_FORWARDED_HEADERS: ${API_TRUST_FORWARDED_HEADERS:-true}
      API_TRUST_PRIVATE_PROXY_HEADERS: ${API_TRUST_PRIVATE_PROXY_HEADERS:-true}
      API_TRUSTED_PROXY_CIDRS: ${API_TRUSTED_PROXY_CIDRS:-}
      PRICE_ALERTS_DEFAULT_ENABLED: ${PRICE_ALERTS_DEFAULT_ENABLED:-false}
      LIMIT_ORDERS_DEFAULT_ENABLED: ${LIMIT_ORDERS_DEFAULT_ENABLED:-true}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      ONEINCH_API_KEY: ${ONEINCH_API_KEY:-}
      ONEINCH_ORDERBOOK_BASE_URL: ${ONEINCH_ORDERBOOK_BASE_URL:-https://api.1inch.com/orderbook/v4.1}
      COW_API_KEY: ${COW_API_KEY:-}
      COW_ORDERBOOK_BASE_URL: ${COW_ORDERBOOK_BASE_URL:-https://api.cow.fi}
      COW_PARTNER_ORDERBOOK_BASE_URL: ${COW_PARTNER_ORDERBOOK_BASE_URL:-https://partners.cow.fi}
      LIMIT_ORDER_ORDERBOOK_SUBMISSION_ENABLED: ${LIMIT_ORDER_ORDERBOOK_SUBMISSION_ENABLED:-true}
      MAINTENANCE_CLEANUP_FIXED_DELAY_MS: ${MAINTENANCE_CLEANUP_FIXED_DELAY_MS:-3600000}
      MAINTENANCE_DELETE_BATCH_SIZE: ${MAINTENANCE_DELETE_BATCH_SIZE:-2000}
      MAINTENANCE_MAX_DELETE_BATCHES_PER_RUN: ${MAINTENANCE_MAX_DELETE_BATCHES_PER_RUN:-5}
      DRY_RUN_HISTORY_RETENTION_DAYS: ${DRY_RUN_HISTORY_RETENTION_DAYS:-180}
      ALERT_RETENTION_DAYS: ${ALERT_RETENTION_DAYS:-365}
      NOTIFICATION_OUTBOX_RETENTION_DAYS: ${NOTIFICATION_OUTBOX_RETENTION_DAYS:-30}
      APP_URL: ${APP_URL:?APP_URL is required}
      NOTIFICATIONS_MONITOR_ENABLED: ${NOTIFICATIONS_MONITOR_ENABLED:-true}
      NOTIFICATIONS_MONITOR_FIXED_DELAY_MS: ${NOTIFICATIONS_MONITOR_FIXED_DELAY_MS:-900000}
      NOTIFICATIONS_CANDIDATE_LIMIT: ${NOTIFICATIONS_CANDIDATE_LIMIT:-2000}
      NOTIFICATIONS_LOOKBACK_DAYS: ${NOTIFICATIONS_LOOKBACK_DAYS:-90}
      NOTIFICATIONS_DEFAULT_PROFIT_THRESHOLD_BPS: ${NOTIFICATIONS_DEFAULT_PROFIT_THRESHOLD_BPS:-100}
      NOTIFICATIONS_DEFAULT_LOSS_THRESHOLD_BPS: ${NOTIFICATIONS_DEFAULT_LOSS_THRESHOLD_BPS:-500}
      NOTIFICATIONS_DEFAULT_COOLDOWN_MINUTES: ${NOTIFICATIONS_DEFAULT_COOLDOWN_MINUTES:-360}
      TELEGRAM_LINK_TTL_MINUTES: ${TELEGRAM_LINK_TTL_MINUTES:-10}
      NOTIFICATIONS_OUTBOX_FIXED_DELAY_MS: ${NOTIFICATIONS_OUTBOX_FIXED_DELAY_MS:-15000}
      NOTIFICATIONS_OUTBOX_BATCH_SIZE: ${NOTIFICATIONS_OUTBOX_BATCH_SIZE:-50}
      NOTIFICATIONS_OUTBOX_MAX_ATTEMPTS: ${NOTIFICATIONS_OUTBOX_MAX_ATTEMPTS:-8}
      NOTIFICATIONS_OUTBOX_LOCK_TTL_SECONDS: ${NOTIFICATIONS_OUTBOX_LOCK_TTL_SECONDS:-120}
      NOTIFICATIONS_ELIGIBLE_STATUSES: ${NOTIFICATIONS_ELIGIBLE_STATUSES:-submitted,confirmed}
      COINGECKO_BASE_URL: ${COINGECKO_BASE_URL:-https://api.coingecko.com/api/v3}
      COINGECKO_API_KEY: ${COINGECKO_API_KEY:-}
      COINGECKO_API_KEY_HEADER: ${COINGECKO_API_KEY_HEADER:-x-cg-demo-api-key}
      COINGECKO_REQUEST_TIMEOUT_SECONDS: ${COINGECKO_REQUEST_TIMEOUT_SECONDS:-8}
      COINGECKO_CONTRACT_BATCH_SIZE: ${COINGECKO_CONTRACT_BATCH_SIZE:-100}
      EMAIL_NOTIFICATIONS_ENABLED: ${EMAIL_NOTIFICATIONS_ENABLED:-false}
      EMAIL_FROM: ${EMAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS_ENABLE: ${SMTP_STARTTLS_ENABLE:-true}
      SMTP_CONNECTION_TIMEOUT_MS: ${SMTP_CONNECTION_TIMEOUT_MS:-10000}
      SMTP_READ_TIMEOUT_MS: ${SMTP_READ_TIMEOUT_MS:-10000}
      SMTP_WRITE_TIMEOUT_MS: ${SMTP_WRITE_TIMEOUT_MS:-10000}
      TELEGRAM_NOTIFICATIONS_ENABLED: ${TELEGRAM_NOTIFICATIONS_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_BASE_URL: ${TELEGRAM_BASE_URL:-https://api.telegram.org}
      PUSH_NOTIFICATIONS_ENABLED: ${PUSH_NOTIFICATIONS_ENABLED:-false}
      PUSH_VAPID_PUBLIC_KEY: ${PUSH_VAPID_PUBLIC_KEY:-}
      PUSH_VAPID_PRIVATE_KEY: ${PUSH_VAPID_PRIVATE_KEY:-}
      PUSH_VAPID_SUBJECT: ${PUSH_VAPID_SUBJECT:-mailto:alerts@swapassistant.app}
      PUSH_ALLOWED_ENDPOINT_HOSTS: ${PUSH_ALLOWED_ENDPOINT_HOSTS:-fcm.googleapis.com,updates.push.services.mozilla.com,web.push.apple.com,.notify.windows.com}
      PUSH_REQUEST_TIMEOUT_SECONDS: ${PUSH_REQUEST_TIMEOUT_SECONDS:-15}
      PUSH_MAX_DEVICES_PER_WALLET: ${PUSH_MAX_DEVICES_PER_WALLET:-10}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID:?NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID is required}
        NEXT_PUBLIC_ALLOWED_CHAIN_IDS: ${NEXT_PUBLIC_ALLOWED_CHAIN_IDS:-8453}
        NEXT_PUBLIC_DISALLOW_MAINNET: ${NEXT_PUBLIC_DISALLOW_MAINNET:-false}
        NEXT_PUBLIC_BACKEND_BASE_URL: /api/backend
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://${APP_DOMAIN}}
    restart: unless-stopped
    environment:
      ZEROX_API_KEY: ${ZEROX_API_KEY:?ZEROX_API_KEY is required}
      ONEINCH_API_KEY: ${ONEINCH_API_KEY:-}
      SWAP_PROVIDERS: ${SWAP_PROVIDERS:-0x,1inch,paraswap,odos}
      PARASWAP_BASE_URL: ${PARASWAP_BASE_URL:-https://api.paraswap.io}
      PARASWAP_API_KEY: ${PARASWAP_API_KEY:-}
      PARASWAP_API_KEY_HEADER: ${PARASWAP_API_KEY_HEADER:-X-API-Key}
      PARASWAP_PARTNER: ${PARASWAP_PARTNER:-swapassistant}
      ODOS_BASE_URL: ${ODOS_BASE_URL:-https://api.odos.xyz}
      ODOS_API_KEY: ${ODOS_API_KEY:-}
      LIFI_BASE_URL: ${LIFI_BASE_URL:-https://li.quest}
      LIFI_API_KEY: ${LIFI_API_KEY:-}
      LIFI_INTEGRATOR: ${LIFI_INTEGRATOR:-}
      AFFILIATE_ADDRESS: ${AFFILIATE_ADDRESS:-0x0000000000000000000000000000000000000000}
      FEE_RECIPIENT_ADDRESS: ${FEE_RECIPIENT_ADDRESS:-0x0000000000000000000000000000000000000000}
      PLATFORM_FEE_BPS: ${PLATFORM_FEE_BPS:-20}
      CORS_ALLOW_ORIGINS: https://${APP_DOMAIN:?APP_DOMAIN is required}
      REQUIRE_ALLOWED_ORIGIN: ${REQUIRE_ALLOWED_ORIGIN:-true}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-30}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}
      RATE_LIMIT_REDIS_PREFIX: ${RATE_LIMIT_REDIS_PREFIX:-swap-assistant-prod}
      RATE_LIMIT_REDIS_FAIL_OPEN: ${RATE_LIMIT_REDIS_FAIL_OPEN:-false}
      RATE_LIMIT_REDIS_REQUIRED: ${RATE_LIMIT_REDIS_REQUIRED:-true}
      RATE_LIMIT_KEY_PEPPER: ${RATE_LIMIT_KEY_PEPPER:?RATE_LIMIT_KEY_PEPPER is required}
      QUOTE_CACHE_TTL_MS: ${QUOTE_CACHE_TTL_MS:-8000}
      QUOTE_CACHE_MAX_ENTRIES: ${QUOTE_CACHE_MAX_ENTRIES:-2000}
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  wallet_postgres_data:
  caddy_data:
  caddy_config:
