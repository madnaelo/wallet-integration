services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: wallet
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
    ports:
      - "55434:5432"
    volumes:
      - wallet_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    profiles: ["full"]
    build:
      context: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/wallet
      DATABASE_USERNAME: wallet
      DATABASE_PASSWORD: wallet
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      SESSION_TTL_HOURS: 168
      NONCE_TTL_MINUTES: 10
      AUTH_SIGNING_DOMAIN: ${AUTH_SIGNING_DOMAIN:-localhost:3000}
      AUTH_SIGNING_URI: ${AUTH_SIGNING_URI:-http://localhost:3000}
      API_MAX_REQUEST_BODY_BYTES: ${API_MAX_REQUEST_BODY_BYTES:-1048576}
      API_RATE_LIMIT_ENABLED: ${API_RATE_LIMIT_ENABLED:-true}
      API_RATE_LIMIT_WINDOW_MS: ${API_RATE_LIMIT_WINDOW_MS:-60000}
      API_RATE_LIMIT_MAX_REQUESTS: ${API_RATE_LIMIT_MAX_REQUESTS:-120}
      API_AUTH_RATE_LIMIT_MAX_REQUESTS: ${API_AUTH_RATE_LIMIT_MAX_REQUESTS:-20}
      AUTO_SWAP_DEFAULT_ENABLED: ${AUTO_SWAP_DEFAULT_ENABLED:-false}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      APP_URL: ${APP_URL:-http://localhost:3000}
      NOTIFICATIONS_MONITOR_ENABLED: ${NOTIFICATIONS_MONITOR_ENABLED:-true}
      NOTIFICATIONS_MONITOR_FIXED_DELAY_MS: ${NOTIFICATIONS_MONITOR_FIXED_DELAY_MS:-900000}
      NOTIFICATIONS_CANDIDATE_LIMIT: ${NOTIFICATIONS_CANDIDATE_LIMIT:-2000}
      NOTIFICATIONS_LOOKBACK_DAYS: ${NOTIFICATIONS_LOOKBACK_DAYS:-90}
      NOTIFICATIONS_DEFAULT_PROFIT_THRESHOLD_BPS: ${NOTIFICATIONS_DEFAULT_PROFIT_THRESHOLD_BPS:-100}
      NOTIFICATIONS_DEFAULT_LOSS_THRESHOLD_BPS: ${NOTIFICATIONS_DEFAULT_LOSS_THRESHOLD_BPS:-500}
      NOTIFICATIONS_DEFAULT_COOLDOWN_MINUTES: ${NOTIFICATIONS_DEFAULT_COOLDOWN_MINUTES:-360}
      TELEGRAM_LINK_TTL_MINUTES: ${TELEGRAM_LINK_TTL_MINUTES:-10}
      NOTIFICATIONS_ELIGIBLE_STATUSES: ${NOTIFICATIONS_ELIGIBLE_STATUSES:-submitted,confirmed}
      COINGECKO_BASE_URL: ${COINGECKO_BASE_URL:-https://api.coingecko.com/api/v3}
      COINGECKO_API_KEY: ${COINGECKO_API_KEY:-}
      COINGECKO_API_KEY_HEADER: ${COINGECKO_API_KEY_HEADER:-x-cg-demo-api-key}
      COINGECKO_REQUEST_TIMEOUT_SECONDS: ${COINGECKO_REQUEST_TIMEOUT_SECONDS:-8}
      COINGECKO_CONTRACT_BATCH_SIZE: ${COINGECKO_CONTRACT_BATCH_SIZE:-100}
      EMAIL_NOTIFICATIONS_ENABLED: ${EMAIL_NOTIFICATIONS_ENABLED:-false}
      EMAIL_FROM: ${EMAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS_ENABLE: ${SMTP_STARTTLS_ENABLE:-true}
      TELEGRAM_NOTIFICATIONS_ENABLED: ${TELEGRAM_NOTIFICATIONS_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_BASE_URL: ${TELEGRAM_BASE_URL:-https://api.telegram.org}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    profiles: ["full"]
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID:-}
        NEXT_PUBLIC_ALLOWED_CHAIN_IDS: ${NEXT_PUBLIC_ALLOWED_CHAIN_IDS:-1}
        NEXT_PUBLIC_DISALLOW_MAINNET: ${NEXT_PUBLIC_DISALLOW_MAINNET:-true}
        NEXT_PUBLIC_BACKEND_BASE_URL: ${NEXT_PUBLIC_BACKEND_BASE_URL:-http://localhost:8080}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    environment:
      ZEROX_API_KEY: ${ZEROX_API_KEY:-}
      ONEINCH_API_KEY: ${ONEINCH_API_KEY:-}
      SWAP_PROVIDERS: ${SWAP_PROVIDERS:-0x,1inch,paraswap,odos}
      PARASWAP_BASE_URL: ${PARASWAP_BASE_URL:-https://api.paraswap.io}
      PARASWAP_API_KEY: ${PARASWAP_API_KEY:-}
      PARASWAP_API_KEY_HEADER: ${PARASWAP_API_KEY_HEADER:-X-API-Key}
      PARASWAP_PARTNER: ${PARASWAP_PARTNER:-thewallet}
      ODOS_BASE_URL: ${ODOS_BASE_URL:-https://api.odos.xyz}
      ODOS_API_KEY: ${ODOS_API_KEY:-}
      LIFI_BASE_URL: ${LIFI_BASE_URL:-https://li.quest}
      LIFI_API_KEY: ${LIFI_API_KEY:-}
      LIFI_INTEGRATOR: ${LIFI_INTEGRATOR:-}
      AFFILIATE_ADDRESS: ${AFFILIATE_ADDRESS:-0x0000000000000000000000000000000000000000}
      FEE_RECIPIENT_ADDRESS: ${FEE_RECIPIENT_ADDRESS:-0x0000000000000000000000000000000000000000}
      PLATFORM_FEE_BPS: ${PLATFORM_FEE_BPS:-20}
      CORS_ALLOW_ORIGINS: http://localhost:3000
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX: 30
      QUOTE_CACHE_TTL_MS: 8000
      QUOTE_CACHE_MAX_ENTRIES: 2000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  wallet_postgres_data:
