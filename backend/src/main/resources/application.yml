server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  shutdown: graceful
  compression:
    enabled: true
    min-response-size: 1024
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false
  tomcat:
    accept-count: ${SERVER_ACCEPT_COUNT:100}
    max-connections: ${SERVER_MAX_CONNECTIONS:2048}
    threads:
      max: ${SERVER_MAX_THREADS:100}
      min-spare: ${SERVER_MIN_SPARE_THREADS:10}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [requestId=%X{requestId:-}] %logger{36} - %msg%n"

spring:
  config:
    import:
      - optional:file:../.env.development[.properties]
      - optional:file:.env.development[.properties]
  application:
    name: swap-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:56434/wallet}
    username: ${DATABASE_USERNAME:wallet}
    password: ${DATABASE_PASSWORD:wallet}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_MAX_SIZE:12}
      minimum-idle: ${DATABASE_POOL_MIN_IDLE:2}
      connection-timeout: ${DATABASE_CONNECTION_TIMEOUT_MS:5000}
      validation-timeout: ${DATABASE_VALIDATION_TIMEOUT_MS:3000}
      idle-timeout: ${DATABASE_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DATABASE_MAX_LIFETIME_MS:1800000}
      keepalive-time: ${DATABASE_KEEPALIVE_MS:300000}
  flyway:
    enabled: true
    clean-disabled: true
    validate-on-migrate: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS_ENABLE:true}
          connectiontimeout: ${SMTP_CONNECTION_TIMEOUT_MS:10000}
          timeout: ${SMTP_READ_TIMEOUT_MS:10000}
          writetimeout: ${SMTP_WRITE_TIMEOUT_MS:10000}

wallet:
  api:
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    max-request-body-bytes: ${API_MAX_REQUEST_BODY_BYTES:1048576}
    rate-limit-enabled: ${API_RATE_LIMIT_ENABLED:true}
    rate-limit-window-ms: ${API_RATE_LIMIT_WINDOW_MS:60000}
    rate-limit-max-requests: ${API_RATE_LIMIT_MAX_REQUESTS:120}
    auth-rate-limit-max-requests: ${API_AUTH_RATE_LIMIT_MAX_REQUESTS:20}
    rate-limit-key-pepper: ${API_RATE_LIMIT_KEY_PEPPER:}
    trust-forwarded-headers: ${API_TRUST_FORWARDED_HEADERS:true}
    trust-private-proxy-headers: ${API_TRUST_PRIVATE_PROXY_HEADERS:true}
    trusted-proxy-cidrs: ${API_TRUSTED_PROXY_CIDRS:}
  auth:
    nonce-ttl-minutes: ${NONCE_TTL_MINUTES:10}
    session-ttl-hours: ${SESSION_TTL_HOURS:168}
    signing-domain: ${AUTH_SIGNING_DOMAIN:localhost:3000}
    signing-uri: ${AUTH_SIGNING_URI:http://localhost:3000}
    session-cookie-same-site: ${AUTH_SESSION_COOKIE_SAME_SITE:Lax}
    session-cookie-secure: ${AUTH_SESSION_COOKIE_SECURE:false}
    expose-access-token: ${AUTH_EXPOSE_ACCESS_TOKEN:false}
  features:
    price-alerts-default-enabled: ${PRICE_ALERTS_DEFAULT_ENABLED:false}
    limit-orders-default-enabled: ${LIMIT_ORDERS_DEFAULT_ENABLED:true}
    admin-api-key: ${ADMIN_API_KEY:}
  limit-orders:
    orderbook-submission-enabled: ${LIMIT_ORDER_ORDERBOOK_SUBMISSION_ENABLED:true}
    oneinch-orderbook-enabled: ${ONEINCH_ORDERBOOK_ENABLED:false}
    oneinch-api-key: ${ONEINCH_API_KEY:}
    oneinch-orderbook-base-url: ${ONEINCH_ORDERBOOK_BASE_URL:https://api.1inch.com/orderbook/v4.1}
    cow-api-key: ${COW_API_KEY:}
    cow-orderbook-base-url: ${COW_ORDERBOOK_BASE_URL:https://api.cow.fi}
    cow-partner-orderbook-base-url: ${COW_PARTNER_ORDERBOOK_BASE_URL:https://partners.cow.fi}
    request-timeout-seconds: ${LIMIT_ORDER_REQUEST_TIMEOUT_SECONDS:8}
    submission-retry-fixed-delay-ms: ${LIMIT_ORDER_SUBMISSION_RETRY_FIXED_DELAY_MS:30000}
    submission-batch-size: ${LIMIT_ORDER_SUBMISSION_BATCH_SIZE:25}
    submission-max-attempts: ${LIMIT_ORDER_SUBMISSION_MAX_ATTEMPTS:8}
    submission-lock-ttl-seconds: ${LIMIT_ORDER_SUBMISSION_LOCK_TTL_SECONDS:60}
    status-check-fixed-delay-ms: ${LIMIT_ORDER_STATUS_CHECK_FIXED_DELAY_MS:30000}
    status-check-batch-size: ${LIMIT_ORDER_STATUS_CHECK_BATCH_SIZE:50}
    status-check-lock-ttl-seconds: ${LIMIT_ORDER_STATUS_CHECK_LOCK_TTL_SECONDS:60}
    status-check-open-interval-seconds: ${LIMIT_ORDER_STATUS_CHECK_OPEN_INTERVAL_SECONDS:60}
    status-check-partial-interval-seconds: ${LIMIT_ORDER_STATUS_CHECK_PARTIAL_INTERVAL_SECONDS:30}
    status-check-max-backoff-seconds: ${LIMIT_ORDER_STATUS_CHECK_MAX_BACKOFF_SECONDS:1800}
  maintenance:
    cleanup-fixed-delay-ms: ${MAINTENANCE_CLEANUP_FIXED_DELAY_MS:3600000}
    dry-run-history-retention-days: ${DRY_RUN_HISTORY_RETENTION_DAYS:180}
    alert-retention-days: ${ALERT_RETENTION_DAYS:365}
    notification-outbox-retention-days: ${NOTIFICATION_OUTBOX_RETENTION_DAYS:30}
  notifications:
    monitor-enabled: ${NOTIFICATIONS_MONITOR_ENABLED:true}
    monitor-fixed-delay-ms: ${NOTIFICATIONS_MONITOR_FIXED_DELAY_MS:900000}
    candidate-limit: ${NOTIFICATIONS_CANDIDATE_LIMIT:2000}
    lookback-days: ${NOTIFICATIONS_LOOKBACK_DAYS:90}
    default-profit-threshold-bps: ${NOTIFICATIONS_DEFAULT_PROFIT_THRESHOLD_BPS:100}
    default-loss-threshold-bps: ${NOTIFICATIONS_DEFAULT_LOSS_THRESHOLD_BPS:500}
    default-cooldown-minutes: ${NOTIFICATIONS_DEFAULT_COOLDOWN_MINUTES:360}
    telegram-link-ttl-minutes: ${TELEGRAM_LINK_TTL_MINUTES:10}
    outbox-fixed-delay-ms: ${NOTIFICATIONS_OUTBOX_FIXED_DELAY_MS:15000}
    outbox-batch-size: ${NOTIFICATIONS_OUTBOX_BATCH_SIZE:50}
    outbox-max-attempts: ${NOTIFICATIONS_OUTBOX_MAX_ATTEMPTS:8}
    outbox-lock-ttl-seconds: ${NOTIFICATIONS_OUTBOX_LOCK_TTL_SECONDS:120}
    eligible-statuses: ${NOTIFICATIONS_ELIGIBLE_STATUSES:submitted,confirmed}
    app-url: ${APP_URL:http://localhost:3000}
    price:
      coingecko-base-url: ${COINGECKO_BASE_URL:https://api.coingecko.com/api/v3}
      coingecko-api-key: ${COINGECKO_API_KEY:}
      coingecko-api-key-header: ${COINGECKO_API_KEY_HEADER:x-cg-demo-api-key}
      request-timeout-seconds: ${COINGECKO_REQUEST_TIMEOUT_SECONDS:8}
      contract-batch-size: ${COINGECKO_CONTRACT_BATCH_SIZE:100}
    email:
      enabled: ${EMAIL_NOTIFICATIONS_ENABLED:false}
      from: ${EMAIL_FROM:}
    telegram:
      enabled: ${TELEGRAM_NOTIFICATIONS_ENABLED:false}
      bot-token: ${TELEGRAM_BOT_TOKEN:}
      bot-username: ${TELEGRAM_BOT_USERNAME:}
      base-url: ${TELEGRAM_BASE_URL:https://api.telegram.org}
    push:
      enabled: ${PUSH_NOTIFICATIONS_ENABLED:false}
      vapid-public-key: ${PUSH_VAPID_PUBLIC_KEY:}
      vapid-private-key: ${PUSH_VAPID_PRIVATE_KEY:}
      vapid-subject: ${PUSH_VAPID_SUBJECT:mailto:alerts@swapassistant.app}
      allowed-endpoint-hosts: ${PUSH_ALLOWED_ENDPOINT_HOSTS:fcm.googleapis.com,updates.push.services.mozilla.com,web.push.apple.com,.notify.windows.com}
      request-timeout-seconds: ${PUSH_REQUEST_TIMEOUT_SECONDS:15}
      max-devices-per-wallet: ${PUSH_MAX_DEVICES_PER_WALLET:10}
